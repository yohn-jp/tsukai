name: CodeQL

# Canonical wrapper distributed via .github/sync.yml (SKIP_PR: true, direct
# push) — do not hand-edit in a consumer repository; edit this file in
# yohn-jp/.github instead. Requires a CodeQL config at
# ./.github/codeql/codeql-config.yml in the consuming repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 3 * * 1"

permissions: {}

jobs:
  analyze:
    uses: yohn-jp/.github/.github/workflows/codeql.yml@main
    with:
      languages: "javascript-typescript,actions"
      config-file: ./.github/codeql/codeql-config.yml
    permissions:
      contents: read
      security-events: write
      actions: read
