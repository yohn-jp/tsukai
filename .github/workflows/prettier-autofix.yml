name: Prettier autofix

# Organization-owned wrapper distributed via .github/sync.yml. This workflow
# uses pull_request_target so the caller definition comes from the consumer's
# default branch, never from PR-authored workflow changes.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

concurrency:
  group: prettier-autofix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  skip-external-fork:
    name: Autofix skipped for external fork PR
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Report fork exclusion
        shell: bash
        run: echo "::notice::Prettier autofix is explicitly skipped for external fork pull requests; the ordinary format check is unchanged."

  skip-recursion:
    name: Autofix skipped for an autofix PR
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'autofix/prettier/pr-')
    runs-on: ubuntu-24.04
    steps:
      - name: Report recursion prevention
        shell: bash
        run: echo "::notice::Prettier autofix PRs are excluded from recursive remediation."

  autofix:
    name: Create stacked Prettier autofix PR
    if: github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.event.pull_request.head.ref, 'autofix/prettier/pr-')
    uses: yohn-jp/.github/.github/workflows/prettier-autofix.yml@main
    with:
      autofix-app-id: ${{ vars.AUTOFIX_APP_ID }}
    secrets:
      AUTOFIX_APP_PRIVATE_KEY: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}
