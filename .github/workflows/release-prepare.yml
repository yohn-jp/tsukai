name: Prepare npm release

# Canonical wrapper distributed via .github/sync.yml (generated from
# .github/sync-groups.yml) — do not hand-edit in a consumer repository; edit
# this file in yohn-jp/.github instead. It prepares the governed
# release/<version> PR only; publication stays with publish.yml.

on:
  workflow_dispatch:
    inputs:
      release-intent:
        description: "Release intent: patch, minor, major, or an exact semantic version."
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: yohn-jp/.github/.github/workflows/npm-release-prepare.yml@main
    with:
      source-revision: ${{ github.sha }}
      release-intent: ${{ inputs.release-intent }}
    permissions:
      contents: write
      pull-requests: write
